<!-- src/app/shared/componentes/admin-summary-card/admin-summary-card.component.html -->

<article class="summary-card" [ngClass]="tipo">

  <div class="summary-icon">
    <ion-icon [name]="icono"></ion-icon>
  </div>

  <div class="summary-info">
    <span>{{ titulo }}</span>
    <strong>{{ valor }}</strong>
  </div>

</article>
