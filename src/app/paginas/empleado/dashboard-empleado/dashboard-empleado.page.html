<!-- src/app/paginas/empleado/dashboard-empleado/dashboard-empleado.page.html -->
<ion-content [fullscreen]="true" class="empleado-root">

  <ion-refresher slot="fixed" (ionRefresh)="refrescar($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ng-container *ngIf="vm$ | async as vm; else cargandoPanel">

    <main class="sm-container">

      <app-empleado-header
        [nombre]="vm.empleado.nombreCompleto || 'Empleado'"
        [cargo]="vm.empleado.cargoTexto || 'Personal operativo'"
        [fotoUrl]="vm.empleado.fotoUrl || ''"
        [iniciales]="vm.empleado.iniciales || 'EM'"
        [notificaciones]="sm41TotalAvisos(vm)"
        (menuClick)="irInicio()"
        (notificacionesClick)="sm41VerTodas()"
        (perfilClick)="abrirPerfil()"
      ></app-empleado-header>

      <section
        class="alerta-acceso"
        *ngIf="!vm.empleado.accesoValido"
      >
        <ion-icon name="alert-circle-outline"></ion-icon>

        <div>
          <h3>Acceso operativo no habilitado</h3>
          <p>Comunícate con el administrador para activar tu acceso.</p>
        </div>
      </section>

      <!-- =====================================================
           MÓDULO 1: INICIO DEL EMPLEADO
      ====================================================== -->

      <app-inicio-empleado
        *ngIf="moduloActual === 'inicio'"
        [vm]="vm"
        (abrirTrabajo)="abrirDetalleTrabajo($event)"
        (irDevoluciones)="irDevoluciones()"
      ></app-inicio-empleado>

      <!-- =====================================================
           MÓDULO 2: TRABAJOS / ACTIVIDADES ASIGNADAS
      ====================================================== -->

      <app-trabajos-empleado
        *ngIf="moduloActual === 'trabajos'"
        [vm]="vm"
        [filtro]="filtroTrabajos"
        (cambiarFiltro)="filtroTrabajos = $event"
        (abrirTrabajo)="abrirDetalleTrabajo($event)"
      ></app-trabajos-empleado>

      <!-- =====================================================
           MÓDULO 3: DETALLE DEL TRABAJO
      ====================================================== -->

      <app-detalle-trabajo-empleado
        *ngIf="moduloActual === 'detalle' && trabajoActual(vm) as trabajo"
        [trabajo]="trabajo"
        (volver)="irTrabajos()"
        (llamar)="llamarCliente($event)"
        (ruta)="abrirRutaTrabajo($event)"
        (codigo)="irCodigo($event)"
        (enCamino)="irCambioEstado($event, 'en_camino')"
        (enProceso)="irCambioEstado($event, 'en_proceso')"
        (finalizar)="irFinalizar($event)"
      ></app-detalle-trabajo-empleado>

      <!-- =====================================================
           MÓDULO 4: CÓDIGO DE VERIFICACIÓN DEL CLIENTE
      ====================================================== -->

      <app-codigo-verificacion-empleado
        *ngIf="moduloActual === 'codigo' && trabajoActual(vm) as trabajo"
        [trabajo]="trabajo"
        (volver)="abrirDetalleTrabajo($event)"
        (copiarCodigo)="copiarCodigoCliente($event)"
      ></app-codigo-verificacion-empleado>

      <!-- =====================================================
           MÓDULO 5: CAMBIO DE ESTADO
           pendiente -> en_camino
           en_camino -> en_proceso
      ====================================================== -->

      <app-cambio-estado-empleado
        *ngIf="moduloActual === 'cambioEstado' && trabajoActual(vm) as trabajo"
        [trabajo]="trabajo"
        [empleado]="vm.empleado"
        [estadoDestino]="estadoDestino"
        [procesando]="estaProcesando(trabajo)"
        (volver)="abrirDetalleTrabajo($event)"
        (confirmar)="confirmarCambioEstado($event, vm.empleado)"
        (abrirMapa)="abrirRutaTrabajo($event)"
      ></app-cambio-estado-empleado>

      <!-- =====================================================
           MÓDULO 6: FINALIZAR TRABAJO
           El empleado registra materiales usados.
           Todavía NO se suma stock aquí.
      ====================================================== -->

      <app-finalizar-trabajo-empleado
        *ngIf="moduloActual === 'finalizar' && trabajoActual(vm) as trabajo"
        [trabajo]="trabajo"
        [empleado]="vm.empleado"
        [procesando]="estaProcesando(trabajo)"
        (volver)="abrirDetalleTrabajo($event)"
        (finalizar)="finalizarDesdeModulo($event)"
      ></app-finalizar-trabajo-empleado>

      <!-- =====================================================
           MÓDULO 7: MATERIALES EN POSESIÓN
           El empleado declara sobrantes.
           El trabajo pasa a devolucion_pendiente.
      ====================================================== -->

      <app-materiales-posesion-empleado
        *ngIf="moduloActual === 'materialesPosesion' && trabajoActual(vm) as trabajo"
        [trabajo]="trabajo"
        [empleado]="vm.empleado"
        [materialesUsados]="materialesUsadosFinalizacion"
        [procesando]="estaProcesando(trabajo)"
        (volver)="abrirDetalleTrabajo($event)"
        (registrarDevolucion)="registrarDevolucionDesdeModulo($event)"
      ></app-materiales-posesion-empleado>

      <!-- =====================================================
           MÓDULO 8: DEVOLUCIONES DEL EMPLEADO
           Aquí el empleado ve lo que registró.
           El administrador valida y recién ahí vuelve al stock.
      ====================================================== -->

      <app-devoluciones-empleado
        *ngIf="moduloActual === 'devoluciones'"
        [vm]="vm"
        [trabajoLocal]="trabajoSeleccionado"
        (volver)="irTrabajos()"
        (abrirTrabajo)="abrirDetalleTrabajo($event)"
      ></app-devoluciones-empleado>

      <!-- =====================================================
           BARRA INFERIOR DEL EMPLEADO
      ====================================================== -->

      <app-empleado-bottom-nav
        [activo]="
          moduloActual === 'inicio'
            ? 'inicio'
            : moduloActual === 'devoluciones'
              ? 'materiales'
              : 'trabajos'
        "
        (inicioClick)="irInicio()"
        (trabajosClick)="irTrabajos()"
        (materialesClick)="irDevoluciones()"
        (historialClick)="irHistorial()"
        (perfilClick)="abrirPerfil()"
      ></app-empleado-bottom-nav>

    </main>

  </ng-container>

  <ng-template #cargandoPanel>
    <main class="sm-container">
      <section class="empty-sm cargando">
        <ion-icon name="time-outline"></ion-icon>
        <h3>Cargando panel empleado</h3>
        <p>Espere un momento.</p>
      </section>
    </main>
  </ng-template>

</ion-content>
