<!--
  src/app/paginas/empleado/dashboard-empleado/
  dashboard-empleado.page.html
-->

<ng-container
  *ngIf="vm$ | async as vm; else cargandoPanel"
>
  <!-- =====================================================
       CABECERA FIJA
  ====================================================== -->

  <ion-header
    class="empleado-shell-header"
    [translucent]="false"
  >
    <app-empleado-header
      [nombre]="
        vm.empleado.nombreCompleto ||
        vm.empleado.usuario ||
        'Empleado'
      "
      [cargo]="
        vm.empleado.cargoTexto ||
        vm.empleado.cargo ||
        'Personal operativo'
      "
      [fotoUrl]="vm.empleado.fotoUrl || ''"
      [iniciales]="vm.empleado.iniciales || 'EM'"
      [notificaciones]="sm41TotalAvisos(vm)"
      (menuClick)="irInicio()"
      (notificacionesClick)="sm41VerTodas()"
      (perfilClick)="abrirPerfil()"
    ></app-empleado-header>
  </ion-header>

  <!-- =====================================================
       CONTENIDO DESPLAZABLE
  ====================================================== -->

  <ion-content
    [fullscreen]="false"
    class="empleado-root"
  >
    <!-- ACTUALIZACIÓN MANUAL -->

    <ion-refresher
      slot="fixed"
      (ionRefresh)="refrescar($event)"
    >
      <ion-refresher-content
        pullingText="Desliza para actualizar"
        refreshingSpinner="crescent"
        refreshingText="Actualizando trabajos..."
      ></ion-refresher-content>
    </ion-refresher>

    <main class="sm-container">

      <!-- =================================================
           EMPLEADO SIN ACCESO
      ================================================== -->

      <section
        class="alerta-acceso"
        *ngIf="!vm.empleado.accesoValido"
      >
        <ion-icon
          name="alert-circle-outline"
          aria-hidden="true"
        ></ion-icon>

        <div>
          <h3>Acceso operativo no habilitado</h3>

          <p>
            Tu cuenta está deshabilitada o no tiene acceso
            como empleado. Comunícate con el administrador.
          </p>
        </div>
      </section>

      <!-- =================================================
           MÓDULOS DEL EMPLEADO
      ================================================== -->

      <ng-container *ngIf="vm.empleado.accesoValido">

        <!-- ===============================================
             INICIO
        ================================================ -->

        <app-inicio-empleado
          *ngIf="moduloActual === 'inicio'"
          [vm]="vm"
          (abrirTrabajo)="abrirDetalleTrabajo($event)"
          (irDevoluciones)="irDevoluciones()"
        ></app-inicio-empleado>

        <!-- ===============================================
             TRABAJOS ASIGNADOS
        ================================================ -->

        <app-trabajos-empleado
          *ngIf="moduloActual === 'trabajos'"
          [vm]="vm"
          [filtro]="filtroTrabajos"
          (cambiarFiltro)="filtroTrabajos = $event"
          (abrirTrabajo)="abrirDetalleTrabajo($event)"
        ></app-trabajos-empleado>

        <!-- ===============================================
             HISTORIAL

             Reutiliza el listado de trabajos mostrando
             únicamente los trabajos finalizados.
        ================================================ -->

        <app-trabajos-empleado
          *ngIf="moduloActual === 'historial'"
          [vm]="vm"
          [filtro]="'finalizadas'"
          (cambiarFiltro)="filtroTrabajos = $event"
          (abrirTrabajo)="abrirDetalleTrabajo($event)"
        ></app-trabajos-empleado>

        <!-- ===============================================
             DETALLE DEL TRABAJO
        ================================================ -->

        <app-detalle-trabajo-empleado
          *ngIf="
            moduloActual === 'detalle' &&
            trabajoActual(vm) as trabajo
          "
          [trabajo]="trabajo"
          (volver)="irTrabajos()"
          (llamar)="llamarCliente($event)"
          (ruta)="abrirRutaTrabajo($event)"
          (codigo)="irCodigo($event)"
          (enCamino)="
            irCambioEstado(
              $event,
              'en_camino'
            )
          "
          (enProceso)="
            irCambioEstado(
              $event,
              'en_proceso'
            )
          "
          (finalizar)="irFinalizar($event)"
        ></app-detalle-trabajo-empleado>

        <!-- ===============================================
             CÓDIGO DE VERIFICACIÓN DEL CLIENTE
        ================================================ -->

        <app-codigo-verificacion-empleado
          *ngIf="
            moduloActual === 'codigo' &&
            trabajoActual(vm) as trabajo
          "
          [trabajo]="trabajo"
          (volver)="abrirDetalleTrabajo($event)"
          (copiarCodigo)="copiarCodigoCliente($event)"
        ></app-codigo-verificacion-empleado>

        <!-- ===============================================
             CAMBIO DE ESTADO

             pendiente → en_camino
             en_camino → en_proceso
        ================================================ -->

        <app-cambio-estado-empleado
          *ngIf="
            moduloActual === 'cambioEstado' &&
            trabajoActual(vm) as trabajo
          "
          [trabajo]="trabajo"
          [empleado]="vm.empleado"
          [estadoDestino]="estadoDestino"
          [procesando]="estaProcesando(trabajo)"
          (volver)="abrirDetalleTrabajo($event)"
          (confirmar)="confirmarCambioEstado($event)"
          (abrirMapa)="abrirRutaTrabajo($event)"
        ></app-cambio-estado-empleado>

        <!-- ===============================================
             FINALIZAR TRABAJO
        ================================================ -->

        <app-finalizar-trabajo-empleado
          *ngIf="
            moduloActual === 'finalizar' &&
            trabajoActual(vm) as trabajo
          "
          [trabajo]="trabajo"
          [empleado]="vm.empleado"
          [procesando]="estaProcesando(trabajo)"
          (volver)="abrirDetalleTrabajo($event)"
          (finalizar)="finalizarDesdeModulo($event)"
        ></app-finalizar-trabajo-empleado>

        <!-- ===============================================
             MATERIALES EN POSESIÓN

             Es una vista interna del proceso de devolución.
        ================================================ -->

        <app-materiales-posesion-empleado
          *ngIf="
            moduloActual === 'materialesPosesion' &&
            trabajoActual(vm) as trabajo
          "
          [trabajo]="trabajo"
          [empleado]="vm.empleado"
          [materialesUsados]="materialesUsadosFinalizacion"
          [procesando]="estaProcesando(trabajo)"
          (volver)="abrirDetalleTrabajo($event)"
          (registrarDevolucion)="
            registrarDevolucionDesdeModulo($event)
          "
        ></app-materiales-posesion-empleado>

        <!-- ===============================================
             DEVOLUCIONES
        ================================================ -->

        <app-devoluciones-empleado
          *ngIf="moduloActual === 'devoluciones'"
          [vm]="vm"
          [trabajoLocal]="trabajoSeleccionado"
          (volver)="irTrabajos()"
          (abrirTrabajo)="abrirDetalleTrabajo($event)"
        ></app-devoluciones-empleado>

      </ng-container>

    </main>
  </ion-content>

  <!-- =====================================================
       BARRA INFERIOR FIJA
  ====================================================== -->

  <ion-footer
    class="empleado-shell-footer"
  >
    <app-empleado-bottom-nav
      [activo]="
        moduloActual === 'inicio'
          ? 'inicio'
          : moduloActual === 'devoluciones' ||
            moduloActual === 'materialesPosesion'
            ? 'devoluciones'
            : moduloActual === 'historial'
              ? 'historial'
              : 'trabajos'
      "
      (inicioClick)="irInicio()"
      (trabajosClick)="irTrabajos()"
      (devolucionesClick)="irDevoluciones()"
      (historialClick)="irHistorial()"
      (perfilClick)="abrirPerfil()"
    ></app-empleado-bottom-nav>
  </ion-footer>

</ng-container>

<!-- =======================================================
     CARGA INICIAL
======================================================== -->

<ng-template #cargandoPanel>

  <ion-content
    [fullscreen]="true"
    class="empleado-root"
  >
    <main class="sm-container sm-container--loading">

      <section class="empty-sm cargando">

        <ion-spinner name="crescent"></ion-spinner>

        <h3>Cargando panel del empleado</h3>

        <p>
          Estamos consultando tus trabajos asignados.
        </p>

      </section>

    </main>
  </ion-content>

</ng-template>
